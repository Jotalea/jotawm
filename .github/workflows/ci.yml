name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: sudo apt-get install -y libx11-dev libxinerama-dev

      - name: Build
        run: make

      - name: Verify binaries exist
        run: test -x jotawm && test -x jotawm-session

      - name: Generate version
        id: version
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date +%Y.%-m.%-d)
          COUNT=$(gh release list --limit 100 --json tagName --jq '.[].tagName' 2>/dev/null | grep -c "^${DATE}-" || true)
          COUNT=${COUNT:-0}
          COUNT=$((COUNT + 1))
          echo "version=${DATE}-$(printf '%03d' $COUNT)" >> $GITHUB_OUTPUT

      - name: Upload binaries
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            jotawm
            jotawm-session

  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential dpkg-dev debhelper pkg-config libx11-dev libxinerama-dev

      - name: Generate debian/changelog
        run: debian/gen-changelog.sh

      - name: Build .deb
        run: dpkg-buildpackage -us -uc -b

      - name: Collect artifacts
        run: |
          mkdir -p debian-build
          cp ../jotawm_*.deb ../jotawm_*.changes ../jotawm_*.buildinfo debian-build/

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: jotawm-deb
          path: debian-build/

  pkg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Arch package
        run: |
          mkdir -p pkg-build
          docker run --rm \
            -v "$PWD":/src:ro \
            -v "$PWD/pkg-build":/out \
            archlinux:base-devel bash -c '
              set -e
              pacman -Sy --noconfirm --needed git libx11 libxinerama
              useradd -m builder
              cp -a /src /home/builder/jotawm
              chown -R builder:builder /home/builder/jotawm
              su builder -c "cd /home/builder/jotawm && makepkg -s --noconfirm --nocheck"
              cp /home/builder/jotawm/jotawm-git-*.pkg.tar.zst /out/
            '

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: jotawm-pkg
          path: pkg-build/

  keybinds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          # Tracks the toolchain declared in go.mod rather than pinning it here.
          go-version-file: keybinds/go.mod
          cache-dependency-path: keybinds/go.sum

      # No X11 -dev packages: the popup talks X over the wire through pure-Go
      # xgb and builds with CGO_ENABLED=0.
      - name: Build
        run: make keybinds

      - name: Verify binary exists
        run: test -x keybinds/jotawm-keybinds

      - name: Upload binary
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: keybinds-binary
          path: keybinds/jotawm-keybinds

  keybinds-pkg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Arch package
        run: |
          mkdir -p keybinds-pkg-build
          docker run --rm \
            -v "$PWD":/src:ro \
            -v "$PWD/keybinds-pkg-build":/out \
            archlinux:base-devel bash -c '
              set -e
              pacman -Sy --noconfirm --needed git go fontconfig
              useradd -m builder
              cp -a /src /home/builder/jotawm
              chown -R builder:builder /home/builder/jotawm
              su builder -c "cd /home/builder/jotawm/keybinds && makepkg -s --noconfirm --nocheck"
              cp /home/builder/jotawm/keybinds/jotawm-keybinds-git-*.pkg.tar.zst /out/
            '

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: jotawm-keybinds-pkg
          path: keybinds-pkg-build/

  release:
    needs: [build, deb, pkg, keybinds, keybinds-pkg]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries

      - name: Download .deb
        uses: actions/download-artifact@v4
        with:
          name: jotawm-deb

      - name: Download Arch package
        uses: actions/download-artifact@v4
        with:
          name: jotawm-pkg

      - name: Download keybinds binary
        uses: actions/download-artifact@v4
        with:
          name: keybinds-binary

      - name: Download keybinds Arch package
        uses: actions/download-artifact@v4
        with:
          name: jotawm-keybinds-pkg

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          chmod +x jotawm jotawm-session jotawm-keybinds
          git log -1 --pretty=format:"## %s%n%n%b" > release-notes.md
          gh release create "$VERSION" \
            --title "jotawm $VERSION" \
            --notes-file release-notes.md \
            --prerelease \
            jotawm jotawm-session jotawm-keybinds *.deb *.pkg.tar.zst

  aur:
    needs: [build, release]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update PKGBUILD pkgver
        run: |
          PKGVER="$(date +%Y.%m.%d).r$(git rev-list --count HEAD).$(git rev-parse --short HEAD)"
          sed -i "s/^pkgver=.*/pkgver=${PKGVER}/" PKGBUILD

      # The in-tree PKGBUILD builds from the local checkout, which is right for
      # local and jotarchy builds but useless on the AUR: makepkg there would
      # clone the user's own AUR build directory, which holds only a PKGBUILD.
      # Point the published copy at the public repository instead.
      - name: Point source at the public repository
        run: |
          sed -i 's#^source=.*#source=("jotawm::git+https://github.com/jotalea/jotawm.git")#' PKGBUILD
          grep '^source=' PKGBUILD

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: jotawm-git
          pkgbuild: ./PKGBUILD
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_username: "Jotalea (actions)"
          commit_email: "main@jotalea.com.ar"

  aur-keybinds:
    needs: [build, release]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare PKGBUILD for the AUR
        run: |
          PKGVER="$(date +%Y.%m.%d).r$(git rev-list --count HEAD).$(git rev-parse --short HEAD)"
          sed -i "s/^pkgver=.*/pkgver=${PKGVER}/" keybinds/PKGBUILD
          sed -i 's#^source=.*#source=("jotawm::git+https://github.com/jotalea/jotawm.git")#' keybinds/PKGBUILD
          grep -E '^(pkgver|source)=' keybinds/PKGBUILD

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: jotawm-keybinds-git
          pkgbuild: ./keybinds/PKGBUILD
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_username: "Jotalea (actions)"
          commit_email: "main@jotalea.com.ar"

  notify:
    needs: [build, release]
    runs-on: ubuntu-latest
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          VERSION: ${{ needs.build.outputs.version }}
          RELEASE_RESULT: ${{ needs.release.result }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "warning: DISCORD_WEBHOOK is not configured. skipping notification."
            exit 0
          fi
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          BRANCH="${{ github.ref_name }}"
          ACTOR="${{ github.actor }}"
          REPO="${{ github.repository }}"
          COMMIT_SHA="${{ github.sha }}"

          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          COMMIT_BODY=$(git log -1 --pretty=format:"%b")
          DIFF_STAT=$(git diff --stat HEAD~1 HEAD 2>/dev/null | tail -1 || true)
          FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | head -20 | sed 's/^/`/' | sed 's/$/`/' | paste -sd ' ')

          if [ "$RELEASE_RESULT" = "success" ]; then
            COLOR=3066993
            RELEASE_FIELD="[\`${VERSION}\`](https://github.com/${REPO}/releases/tag/${VERSION})"
          else
            COLOR=15158332
            RELEASE_FIELD="failed"
          fi

          DESC=$(printf '%s' "$COMMIT_BODY")
          if [ -n "$DIFF_STAT" ]; then
            [ -n "$DESC" ] && DESC=$(printf '%s\n\n' "$DESC")
            DESC=$(printf '%s**%s**' "$DESC" "$DIFF_STAT")
          fi
          [ -z "$FILES" ] && FILES="none"

          jq -n \
            --arg title "[$SHORT_SHA] $COMMIT_MSG" \
            --arg commit_url "https://github.com/${REPO}/commit/${COMMIT_SHA}" \
            --arg desc "$DESC" \
            --arg actor "$ACTOR" \
            --arg branch "$BRANCH" \
            --arg release "$RELEASE_FIELD" \
            --arg files "$FILES" \
            --argjson color "$COLOR" \
            '{
              embeds: [{
                title: $title,
                url: $commit_url,
                color: $color,
                description: (if $desc == "" then null else $desc end),
                fields: [
                  {name: "Release", value: $release, inline: true},
                  {name: "Author", value: $actor, inline: true},
                  {name: "Branch", value: $branch, inline: true},
                  {name: "Files changed", value: $files, inline: false}
                ],
                footer: {text: "jotawm CI"}
              }]
            }' | curl -sf -X POST "$DISCORD_WEBHOOK" \
              -H "Content-Type: application/json" \
              -d @-
